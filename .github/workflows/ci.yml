name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: '10.15.0'

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint all workspaces
        run: pnpm lint
      - name: Type-check all workspaces
        run: pnpm typecheck

  node-tests:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            command: pnpm --filter frontend test --coverage
            coverage-path: frontend/coverage
          - name: backend
            command: >-
              pnpm --filter backend test --coverage
              --coverageThreshold='{"global":{"branches":60,"functions":60,"lines":60,"statements":60}}'
            coverage-path: backend/coverage
          - name: shared-utils
            command: pnpm --filter @portal/shared-utils test:coverage
            coverage-path: packages/shared-utils/coverage
          - name: api-service
            command: >-
              pnpm --filter @portal/shared-types build &&
              pnpm --filter @portal/shared-utils build &&
              pnpm --filter @portal/api test:coverage
            coverage-path: services/api/coverage
          - name: worker-service
            command: >-
              pnpm --filter @portal/shared-types build &&
              pnpm --filter @portal/shared-utils build &&
              pnpm --filter @portal/worker test:coverage
            coverage-path: services/worker/coverage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run tests with a 60% coverage floor
        run: ${{ matrix.command }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.coverage-path }}
          if-no-files-found: warn
          retention-days: 7

  python-tests:
    name: Test / python-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements*.txt
      - run: python -m pip install -r worker/requirements-dev.txt
      - name: Lint Python worker and scheduled jobs
        run: python -m ruff check worker jobs
      - name: Run tests with a 60% coverage floor
        run: pytest worker/tests --cov=reconcile --cov-report=term-missing --cov-report=xml:worker/coverage.xml --cov-fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-worker
          path: worker/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Next.js build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/admin-web/.next/cache
            apps/customer-web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-build-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-build
          path: |
            **/dist/**
            apps/*/.next/**
            !apps/*/.next/cache/**
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, node-tests, python-tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          QUALITY: ${{ needs.quality.result }}
          NODE_TESTS: ${{ needs.node-tests.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for result in "$QUALITY" "$NODE_TESTS" "$PYTHON_TESTS" "$BUILD"; do
            test "$result" = success
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-build
          path: build-artifacts
      - name: Confirm packaged output is reusable
        run: test -n "$(find build-artifacts -type f -print -quit)"
