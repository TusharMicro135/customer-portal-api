name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.15.0'

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint all workspaces
        run: pnpm lint
      - name: Type-check all workspaces
        run: pnpm typecheck

  node-tests:
    name: Test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            command: pnpm --filter frontend test --coverage
            coverage-path: frontend/coverage
          - name: backend
            command: >-
              pnpm --filter backend test --coverage
              --coverageThreshold='{"global":{"branches":60,"functions":60,"lines":60,"statements":60}}'
            coverage-path: backend/coverage
          - name: shared-utils
            command: pnpm --filter @portal/shared-utils test:coverage
            coverage-path: packages/shared-utils/coverage
          - name: api-service
            command: >-
              pnpm --filter @portal/shared-types build &&
              pnpm --filter @portal/shared-utils build &&
              pnpm --filter @portal/api test:coverage
            coverage-path: services/api/coverage
          - name: worker-service
            command: >-
              pnpm --filter @portal/shared-types build &&
              pnpm --filter @portal/shared-utils build &&
              pnpm --filter @portal/worker test:coverage
            coverage-path: services/worker/coverage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run tests with a 60% coverage floor
        run: ${{ matrix.command }}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.coverage-path }}
          if-no-files-found: warn
          retention-days: 7

  python-tests:
    name: Test / python-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements*.txt
      - run: python -m pip install -r worker/requirements-dev.txt
      - name: Run tests with a 60% coverage floor
        run: pytest worker/tests --cov=reconcile --cov-report=term-missing --cov-report=xml:worker/coverage.xml --cov-fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-worker
          path: worker/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Next.js build caches
        uses: actions/cache@v4
        with:
          path: |
            apps/admin-web/.next/cache
            apps/customer-web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package build output
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: |
            **/dist/**
            apps/*/.next/**
            !apps/*/.next/cache/**
          if-no-files-found: error
          retention-days: 7

  artifact-consumer:
    name: Validate reusable build artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-build
          path: build-artifacts
      - name: Confirm packaged output is reusable
        run: test -n "$(find build-artifacts -type f -print -quit)"

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, node-tests, python-tests, build, artifact-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          QUALITY: ${{ needs.quality.result }}
          NODE_TESTS: ${{ needs.node-tests.result }}
          PYTHON_TESTS: ${{ needs.python-tests.result }}
          BUILD: ${{ needs.build.result }}
          ARTIFACT: ${{ needs.artifact-consumer.result }}
        run: |
          for result in "$QUALITY" "$NODE_TESTS" "$PYTHON_TESTS" "$BUILD" "$ARTIFACT"; do
            test "$result" = success
          done
